name: HMM CI

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      
    - name: Compile
      run: |
        cd hmm_sim
        make
      
    - name: Basic Tests
      run: |
        cd hmm_sim
        chmod +x ./tests/testScript.sh
        make testHmm
        
    - name: Stress Test
      run: |
        cd hmm_sim
        make testStress
        
    - name: Multithreaded Test
      run: |
        cd hmm_sim
        make testMultithread 